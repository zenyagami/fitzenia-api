ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        # analyze-image-stream can sit 20s+ between writes (Claude, then the Gemini
        # fallback). Netty's default response write timeout is 10s; the route's 5s SSE
        # ping keeps bytes flowing and this raised backstop covers a delayed ping tick.
        responseWriteTimeoutSeconds = 120
    }
    application {
        modules = [ com.zenthek.fitzenio.rest.ApplicationKt.module ]
    }
}

app {
    projectId = ${?PROJECT_ID}
}
