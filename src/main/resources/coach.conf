ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        # SSE turns buffer the whole response, so the connection can go many seconds between
        # writes. The Netty engine's default response write timeout is 10s — too short — which
        # closes the socket mid-turn and surfaces as a Cloud Run 503. The periodic ping in
        # ChatRoutes keeps bytes flowing (< this window); this raised backstop guarantees one
        # delayed ping tick under load can't trip it. Stays under Cloud Run's 300s request cap.
        responseWriteTimeoutSeconds = 120
    }
    application {
        modules = [ com.zenthek.coach.CoachApplicationKt.module ]
    }
}

# AI Coach service config. Model IDs and the tz fallback are NOT env vars — they
# live as code constants in com.zenthek.coach.config.CoachModels. Only secrets
# (GEMINI_API_KEY, SUPABASE_*) come from env, reused from the existing config.
app {
    projectId = ${?PROJECT_ID}
}
