ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.zenthek.coach.CoachApplicationKt.module ]
    }
}

# AI Coach service config. Model IDs and the tz fallback are NOT env vars — they
# live as code constants in com.zenthek.coach.config.CoachModels. Only secrets
# (GEMINI_API_KEY, SUPABASE_*) come from env, reused from the existing config.
app {
    projectId = ${?PROJECT_ID}
}
