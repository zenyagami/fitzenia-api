apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: fitzenia-coach-prod
  labels:
    cloud.googleapis.com/location: europe-north1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Execution environment
        run.googleapis.com/execution-environment: gen2

        # CPU and memory allocation. Coach holds SSE connections and runs LLM
        # turns, so it gets more CPU than the API and CPU is never throttled
        # (streaming must keep flushing between tokens).
        run.googleapis.com/cpu: "2"
        run.googleapis.com/memory: "1Gi"
        run.googleapis.com/cpu-throttling: "false"

        # Auto-scaling. minScale:0 keeps cost at zero while idle during
        # dev/launch (accepts cold starts). Bump to "1" for latency once traffic
        # justifies it (see docs/AI_COACH.md).
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "20"

        # Long timeout for streaming chat turns.
        run.googleapis.com/timeout: "300s"
        run.googleapis.com/healthcheck-path: /health
    spec:
      containerConcurrency: 20
      timeoutSeconds: 300
      containers:
      - name: fitzenia-coach-prod
        image: gcr.io/PROJECT_ID/fitzenia-coach-prod:IMAGE_TAG
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: APP_ENVIRONMENT
          value: "PRODUCTION"
        # Model IDs + tz fallback are NOT env vars — they are code constants in
        # com.zenthek.coach.config.CoachModels (changed via review + deploy).
        # ---------- Shared secrets (reused from the API) ----------
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: GEMINI_API_KEY
              key: latest
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: SUPABASE_URL
              key: latest
        - name: SUPABASE_PUBLISHABLE_KEY
          valueFrom:
            secretKeyRef:
              name: SUPABASE_PUBLISHABLE_KEY
              key: latest
        - name: SUPABASE_JWT_VERIFICATION_MODE
          value: "JWKS"
        # Backend-only. Bypasses RLS. Never expose to clients.
        - name: SUPABASE_SERVICE_ROLE_KEY
          valueFrom:
            secretKeyRef:
              name: SUPABASE_SERVICE_ROLE_KEY
              key: latest
        # ---------- RevenueCat lazy sync-on-miss ----------
        # Enables the premium gate to reconcile a user's live RevenueCat subscriber snapshot on a
        # cache miss. NOT the webhook secret — the webhook lives on fitzenia-api, not here.
        - name: REVENUECAT_REST_API_KEY
          valueFrom:
            secretKeyRef:
              name: REVENUECAT_REST_API_KEY
              key: latest
        # ---------- Langfuse (deferred observability fast-follow) ----------
        # - name: LANGFUSE_PUBLIC_KEY
        #     valueFrom: { secretKeyRef: { name: LANGFUSE_PUBLIC_KEY, key: latest } }
        resources:
          limits:
            cpu: "2"
            memory: "1Gi"
          requests:
            cpu: "1"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
